services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vitra
      POSTGRES_PASSWORD: vitra_local_only
      POSTGRES_DB: vitra
    ports:
      - "5432:5432"
    volumes:
      - vitra_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitra -d vitra"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vitra_postgres_data:
